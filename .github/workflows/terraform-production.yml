name: "Terraform: Production"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: 'Required when action is "destroy": type "destroy-production" to confirm'
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "adventus-infrastructure/terraform/**"

# Prevent parallel Terraform runs (no DynamoDB state locking)
concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: adventus-infrastructure/terraform/environments/production

jobs:
  guard:
    name: Guard Destroy Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Require typed confirmation for destroy
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ] && [ "${{ github.event.inputs.confirm_destroy }}" != "destroy-production" ]; then
            echo "::error::Destroying production requires typing 'destroy-production' in the confirm_destroy input."
            exit 1
          fi

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: guard
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=adventus/production/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve
          fi
